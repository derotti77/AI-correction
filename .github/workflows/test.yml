name: 🤖 AI Text Corrector Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    
    steps:
    - name: 📦 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: 🧪 Test Python syntax
      run: |
        python -m py_compile ai-corrector.py
        python -m py_compile raycast-ai-corrector.py
        
    - name: ✅ Test imports
      run: |
        python -c "import tkinter; print('✅ GUI support available')"
        python -c "import requests; print('✅ HTTP requests available')"
        
    - name: 📋 Validate scripts are executable  
      run: |
        test -x raycast-ai-corrector.py && echo "✅ Raycast script is executable"
        test -x install-english.sh && echo "✅ Installer is executable"
        
    - name: 🔍 Check file structure
      run: |
        test -f README.md && echo "✅ README.md exists"
        test -f QUICK-START.md && echo "✅ QUICK-START.md exists"  
        test -f LICENSE && echo "✅ LICENSE exists"
        
    - name: 📊 Generate test report
      run: |
        echo "🎉 All tests passed!"
        echo "📈 Repository is ready for international users"
